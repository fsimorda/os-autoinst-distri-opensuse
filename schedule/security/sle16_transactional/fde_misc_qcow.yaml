name: fde_misc_qcow
description: >
  Test fde misc using preinstalled qcow2 images in immutable mode
schedule:
  - installation/bootloader_uefi
  - '{{firstboot}}'
  - transactional/host_config
  - console/suseconnect_scc
  - microos/services_enabled
  - transactional/disable_timers
  - security/selinux/selinux_setup
  - security/tpm2/tpm2_verify_presence
  - security/tpm2/tpm2_fail_key_unsealing
  - security/fde_regenerate_key
conditional_schedule:
  firstboot:
    ARCH:
      # ppc64le images are configured on first boot by a seed disk (HDD_2,
      # cloud-init or ignition), so the jeos-firstboot wizard never runs.
      # It would also only be rendered on the serial console there, so
      # wait for the login prompt instead of the wizard.
      ppc64le:
        - installation/first_boot
      x86_64:
        - jeos/firstrun
      aarch64:
        - jeos/firstrun
      s390x:
        - jeos/firstrun
